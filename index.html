<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Brewery Recipe Guide</title><style>
:root{color-scheme:dark;background:#10151c;color:#e8edf2;font:16px system-ui}body{margin:0;padding:24px;max-width:1200px;margin:auto}h1{margin:0}p{color:#aebbc8}.tools{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select{padding:12px;border-radius:10px;border:1px solid #354454;background:#1b2531;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{border:1px solid #354454;border-radius:15px;overflow:hidden;background:#1b2531}.head{padding:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #354454}.swatch{width:48px;height:48px;display:grid;place-items:center;font-size:30px;flex-shrink:0}.head h2{font-size:18px;margin:0}.head small{color:#aebbc8}.body{padding:16px}.body h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#aebbc8;margin:15px 0 7px}.body h3:first-child{margin-top:0}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 9px;background:#283646;border-radius:9px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#121a23;padding:10px;border-radius:10px}.stat b{display:block;font-size:17px}.stat small{color:#aebbc8}.ul{margin:0;padding-left:18px}.empty{color:#71808f}.footer{margin-top:24px;font-size:13px;color:#9eacb9}</style></head><body><h1>🍺 Brewery Recipes</h1><p>Browse recipes visually. Search ingredients or recipe names, or filter by type.</p><div class="tools"><input id="search" placeholder="Search recipe / ingredient..." style="flex:1;min-width:200px"><select id="filter"><option value="">All recipes</option></select></div><div class="grid" id="grid"></div><p class="footer">Barrel wood values: 0 Any · 1 Birch · 2 Oak · 3 Jungle · 4 Spruce · 5 Acacia · 6 Dark Oak · 7 Crimson · 8 Warped · 9 Mangrove · 10 Cherry · 11 Bamboo · 12 Cut Copper. Values shown as in your config.</p><script>const data=[{"key": "wheatbeer", "names": "Skunky Wheatbeer / Wheatbeer / Fine Wheatbeer", "ingredients": ["Wheat \u00d73"], "cook": 8, "dist": 0, "dt": null, "wood": 1, "age": 2, "color": "#ffb84d", "diff": 1, "alc": 5, "lore": ["+++ &8Refreshing"], "effects": [], "typ": "Wheat beer"}, {"key": "beer", "names": "Skunky Beer / Beer / Fine Beer", "ingredients": ["Wheat \u00d76"], "cook": 8, "dist": 0, "dt": null, "wood": 0, "age": 3, "color": "#ffd333", "diff": 1, "alc": 6, "lore": ["+++ &8Crisp taste"], "effects": [], "typ": "Beer"}, {"key": "darkbeer", "names": "Skunky Darkbeer / Darkbeer / Fine Darkbeer", "ingredients": ["Wheat \u00d76"], "cook": 8, "dist": 0, "dt": null, "wood": 6, "age": 8, "color": "#650013", "diff": 2, "alc": 7, "lore": ["+++ &8Roasted taste"], "effects": [], "typ": "Dark beer"}, {"key": "wine", "names": "Red Wine", "ingredients": ["Sweet Berries \u00d75"], "cook": 5, "dist": 0, "dt": null, "wood": 0, "age": 20, "color": "RED", "diff": 4, "alc": 8, "lore": ["+ &8Harsh", "+ &8Corked", "++ &8Mellow", "+++ &8Full-Bodied"], "effects": [], "typ": "Wine"}, {"key": "mead", "names": "Awkward Mead / Mead / Golden Mead", "ingredients": ["Sugar Cane \u00d76"], "cook": 3, "dist": 0, "dt": null, "wood": 2, "age": 4, "color": "ORANGE", "diff": 2, "alc": 9, "lore": ["+++ Has a golden shine"], "effects": [], "typ": "Mead"}, {"key": "ap_mead", "names": "Apple Mead / Sweet Apple Mead / Sweet Golden Apple Mead", "ingredients": ["Sugar Cane \u00d76", "Apple \u00d72"], "cook": 4, "dist": 0, "dt": null, "wood": 2, "age": 4, "color": "ORANGE", "diff": 4, "alc": 11, "lore": ["Is there any Apple in this?", "Refreshing taste of Apple", "Sweetest hint of Apple"], "effects": ["WATER_BREATHING/1-2/150"], "typ": "Apple mead"}, {"key": "cidre", "names": "Poor Cidre / Apple Cider / Great Apple Cider", "ingredients": ["Apple \u00d714"], "cook": 7, "dist": 0, "dt": null, "wood": 0, "age": 3, "color": "#f86820", "diff": 4, "alc": 7, "lore": [], "effects": [], "typ": "Cider"}, {"key": "apple_liquor", "names": "Sour Apple Liquor / Apple Liquor / Calvados", "ingredients": ["Apple \u00d712"], "cook": 16, "dist": 3, "dt": null, "wood": 5, "age": 6, "color": "BRIGHT_RED", "diff": 5, "alc": 14, "lore": ["+ Sour like Acid", "+++ Good Apple Liquor"], "effects": [], "typ": "Apple spirit"}, {"key": "whiskey", "names": "Unsightly Whiskey / Whiskey / Scotch Whiskey", "ingredients": ["Wheat \u00d710"], "cook": 10, "dist": 2, "dt": 50, "wood": 4, "age": 18, "color": "ORANGE", "diff": 7, "alc": 26, "lore": ["Single Malt"], "effects": [], "typ": "Whiskey"}, {"key": "rum", "names": "Bitter Rum / Spicy Rum / Golden Rum", "ingredients": ["Sugar Cane \u00d718"], "cook": 6, "dist": 2, "dt": 30, "wood": 2, "age": 14, "color": "DARK_RED", "diff": 6, "alc": 30, "lore": ["+ &8Too bitter to drink", "++ &8Spiced by the barrel", "+++ &eSpiced Gold"], "effects": ["FIRE_RESISTANCE/1/20-100", "POISON/1-0/30-0"], "typ": "Rum"}, {"key": "vodka", "names": "Lousy Vodka / Vodka / Russian Vodka", "ingredients": ["Potato \u00d710"], "cook": 15, "dist": 3, "dt": null, "wood": 0, "age": 0, "color": "WHITE", "diff": 4, "alc": 20, "lore": ["+ &8Almost undrinkable"], "effects": ["WEAKNESS/15", "POISON/10"], "typ": "Vodka"}, {"key": "shroom_vodka", "names": "Mushroom Vodka / Mushroom Vodka / Glowing Mushroom Vodka", "ingredients": ["Potato \u00d710", "Red Mushroom \u00d73", "Brown Mushroom \u00d73"], "cook": 18, "dist": 5, "dt": null, "wood": 0, "age": 0, "color": "#ff9999", "diff": 7, "alc": 18, "lore": ["+++ &aGlows in the dark"], "effects": ["WEAKNESS/80", "CONFUSION/27", "NIGHT_VISION/50-80", "BLINDNESS/12-2", "SLOW/10-3"], "typ": "Mushroom vodka"}, {"key": "gin", "names": "Pale Gin / Gin / Old Tom Gin", "ingredients": ["Wheat \u00d79", "Blue flowers \u00d76", "Apple \u00d71"], "cook": 6, "dist": 2, "dt": null, "wood": null, "age": null, "color": "#99ddff", "diff": 6, "alc": 20, "lore": ["++ With the", "++ taste of juniper", "+++ Perfectly finished off", "+++ with juniper"], "effects": [], "typ": "Gin"}, {"key": "tequila", "names": "Mezcal / Tequila / Tequila anejo", "ingredients": ["Cactus \u00d78"], "cook": 15, "dist": 2, "dt": null, "wood": 1, "age": 12, "color": "#f5f07e", "diff": 5, "alc": 20, "lore": ["Desert spirit"], "effects": [], "typ": "Tequila"}, {"key": "absinthe", "names": "Poor Absinthe / Absinthe / Strong Absinthe", "ingredients": ["Grass \u00d715"], "cook": 3, "dist": 6, "dt": 80, "wood": null, "age": null, "color": "GREEN", "diff": 8, "alc": 42, "lore": ["+++ &8High proof liquor"], "effects": ["POISON/15-25"], "typ": "Absinthe"}, {"key": "gr_absinthe", "names": "Poor Absinthe / Green Absinthe / Bright Green Absinthe", "ingredients": ["Grass \u00d717", "Poisonous Potato \u00d72"], "cook": 5, "dist": 6, "dt": 85, "wood": null, "age": null, "color": "LIME", "diff": 9, "alc": 46, "lore": ["&aLooks poisonous"], "effects": ["POISON/25-40", "HARM/2", "NIGHT_VISION/40-60"], "typ": "Green absinthe"}, {"key": "potato_soup", "names": "Potato soup", "ingredients": ["Potato \u00d75", "Grass \u00d73"], "cook": 3, "dist": null, "dt": null, "wood": null, "age": null, "color": "ORANGE", "diff": 1, "alc": null, "lore": [], "effects": ["HEAL/0-1"], "typ": "Soup"}, {"key": "coffee", "names": "Stale Coffee / Coffee / Strong Coffee", "ingredients": ["Cocoa Beans \u00d712", "Milk Bucket \u00d72"], "cook": 2, "dist": null, "dt": null, "wood": null, "age": null, "color": "BLACK", "diff": 3, "alc": -6, "lore": ["+ &8Probably a week old"], "effects": ["REGENERATION/1/2-5", "SPEED/1/30-140"], "typ": "Coffee"}, {"key": "eggnog", "names": "Egg Liquor / Eggnog / Advocaat", "ingredients": ["Egg \u00d75", "Sugar \u00d72", "Milk Bucket \u00d71"], "cook": 2, "dist": null, "dt": null, "wood": null, "age": 3, "color": "#ffe680", "diff": 4, "alc": 10, "lore": ["Made with raw egg"], "effects": [], "typ": "Eggnog"}, {"key": "g_vodka", "names": "Rancid Vodka / Golden Vodka / Shimmering Golden Vodka", "ingredients": ["Potato \u00d710", "Gold Nugget \u00d72"], "cook": 18, "dist": 3, "dt": null, "wood": null, "age": 0, "color": "ORANGE", "diff": 6, "alc": 20, "lore": [], "effects": ["WEAKNESS/28", "POISON/4"], "typ": "Golden vodka"}, {"key": "fire_whiskey", "names": "Powdery Whiskey / Burning Whiskey / Blazing Whiskey", "ingredients": ["Wheat \u00d710", "Blaze Powder \u00d72"], "cook": 12, "dist": 3, "dt": 55, "wood": 4, "age": 18, "color": "ORANGE", "diff": 7, "alc": 28, "lore": ["You get a burning feeling in your mouth"], "effects": [], "typ": "Fire whiskey"}, {"key": "hot_choc", "names": "Hot Chocolate", "ingredients": ["Cookie \u00d73"], "cook": 2, "dist": null, "dt": null, "wood": null, "age": null, "color": "DARK_RED", "diff": 2, "alc": null, "lore": [], "effects": ["FAST_DIGGING/40"], "typ": "Hot chocolate"}, {"key": "iced_coffee", "names": "Watery Coffee / Iced Coffee / Strong Iced Coffee", "ingredients": ["Cookie \u00d78", "Snowball \u00d74", "Milk Bucket \u00d71"], "cook": 1, "dist": null, "dt": null, "wood": null, "age": null, "color": "BLACK", "diff": 4, "alc": -8, "lore": [], "effects": ["REGENERATION/30", "SPEED/10"], "typ": "Iced coffee"}];const filter=document.querySelector('#filter'),search=document.querySelector('#search'),grid=document.querySelector('#grid');data.forEach(r=>{let o=document.createElement('option');o.value=r.typ;o.textContent=r.typ;filter.append(o)});function woodname(w){return ({0:'Any wood',1:'Birch',2:'Oak',3:'Jungle',4:'Spruce',5:'Acacia',6:'Dark Oak',7:'Crimson',8:'Warped',9:'Mangrove',10:'Cherry',11:'Bamboo',12:'Cut copper'})[w]??'—'}function list(a){return a.length?'<ul class="ul">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<span class="empty">None specified</span>'}function draw(){let q=search.value.toLowerCase(),f=filter.value;grid.innerHTML=data.filter(r=>(!f||r.typ===f)&&(!q||(r.names+' '+r.typ+' '+r.ingredients.join(' ')+' '+r.lore.join(' ')+' '+r.effects.join(' ')).toLowerCase().includes(q))).map(r=>{let col=r.color.startsWith('#')?r.color:({RED:'#e53935',ORANGE:'#ff9800',DARK_RED:'#8b0000',BRIGHT_RED:'#ff1744',WHITE:'#eeeeee',GREEN:'#28a745',LIME:'#b6ff00',BLACK:'#222222'})[r.color]||'#596a7c';return `<article class="card"><div class="head"><div class="swatch" aria-label="${r.typ}">${({"Wheat beer":"🍺","Beer":"🍺","Dark beer":"🍺","Wine":"🍷","Mead":"🍯","Apple mead":"🍎","Cider":"🍎","Apple spirit":"🍎","Whiskey":"🥃","Rum":"🥃","Vodka":"🍸","Mushroom vodka":"🍄","Gin":"🍸","Tequila":"🌵","Absinthe":"🌿","Green absinthe":"🌿","Soup":"🥣","Coffee":"☕","Eggnog":"🥛","Golden vodka":"✨","Fire whiskey":"🔥","Hot chocolate":"🍫","Iced coffee":"🧋"})[r.typ]||"🍶"}</div><div><h2>${r.typ}</h2><small>${r.names}</small></div></div><div class="body"><h3>Ingredients</h3>${list(r.ingredients)}<h3>Brewing</h3><div class="stats"><div class="stat"><b>${r.cook??'—'}</b><small>Cook time</small></div><div class="stat"><b>${r.dist??'—'}</b><small>Distill runs</small></div><div class="stat"><b>${r.dt??'—'}</b><small>Distill time</small></div><div class="stat"><b>${r.age??'—'}</b><small>Age</small></div><div class="stat"><b>${r.wood===null?'—':woodname(r.wood)}</b><small>Wood</small></div><div class="stat"><b>${r.diff??'—'}</b><small>Difficulty</small></div></div><h3>Alcohol</h3><div class="chip">${r.alc===null?'Not specified':r.alc+'%'}</div><h3>Drink color</h3><div class="chip"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${col};vertical-align:middle;margin-right:6px;border:1px solid #667"></span>${r.color}</div><h3>Lore</h3>${list(r.lore)}<h3>Effects</h3>${list(r.effects)}</div></article>`}).join('');}search.addEventListener('input',draw);filter.addEventListener('change',draw);draw();</script></body></html>
